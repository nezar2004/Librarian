<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حجوزات الكتب | Librarian</title>
  <link rel="stylesheet" href="library-tools.css?v=portal">

</head>
<body class="catalog-page reservation-page">
  <header class="catalog-shell catalog-header">
    <a class="reservation-brand" href="index.html">Librarian</a>
    <a class="reservation-catalog" href="catalog.html">تصفّح الكتب</a>
  </header>
  <main class="catalog-shell">
    <div class="reservation-hero">
      <svg class="reservation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-12 5 2 2 4-4"/></svg>
      <div>
        <p class="catalog-kicker">المكتبة الرقمية</p>
        <h1>حجوزات الكتب</h1>
        <p class="reservation-description">احجز كتابك وتابع حالة الطلب أو دورك في قائمة الانتظار.</p>
      </div>
    </div>
    <p id="reservation-status" data-state="pending" role="status" aria-atomic="true">جاري التحقق من الحساب…</p>
    <div id="reservation-login" hidden><a href="student_login.html">دخول الطالب</a> · <a href="admin_login.html">دخول أمين المكتبة</a></div>
    <form id="reservation-form" class="reservation-panel" hidden>
      <h2>طلب حجز جديد</h2>
      <p>إذا الكتاب غير متاح، بينضاف طلبك لقائمة الانتظار. أمين المكتبة بحدّد متى النسخة جاهزة للاستلام.</p>
      <div class="catalog-filters">
        <label>الكتاب <select id="reservation-book" required><option value="">اختر كتابًا</option></select></label>
      </div>
      <button class="reservation-submit" type="submit">إرسال طلب الحجز</button>
    </form>
    <section id="reservation-list" class="reservation-panel" hidden>
      <h2 id="reservation-list-title">طلباتي</h2>
      <div id="reservation-results" class="catalog-grid"></div>
    </section>
  </main>
  <noscript><p class="catalog-shell">فعّل JavaScript حتى تقدر تستخدم صفحة الحجوزات.</p></noscript>
  <script type="module">
    import("./reservations.js?v=portal").then(({ startReservations }) => {
      startReservations(document.querySelector("main"));
    }).catch(() => {
      const status = document.querySelector("#reservation-status");
      status.dataset.state = "error";
      status.textContent = "تعذّر تحميل صفحة الحجوزات. تأكّد من الاتصال وحدّث الصفحة.";
    });
  </script>
</body>
</html>
