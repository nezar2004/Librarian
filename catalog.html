<head>

<body class="library-site catalog-page">
  <a class="site-skip" href="#main">انتقل إلى المحتوى</a>
  <header class="site-header"><div class="site-shell site-header-inner"><a class="site-brand" href="index.html"><span class="site-brand-mark"><svg class="site-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a3 3 0 0 1 3-3h12v18H7a3 3 0 0 1 0-6h12M4 5v12m4-10h7m-7 4h5"/></svg></span><span dir="ltr">Librarian</span></a><a class="site-button site-secondary" href="student_login.html">دخول الطالب</a><button id="library-language" class="language-control" type="button" lang="en" aria-label="English" hidden>English</button></div></header>
