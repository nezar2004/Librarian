<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول الطالب | Librarian</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&amp;display=swap">
  <link rel="stylesheet" href="login.css?v=language-1">
</head>
<body class="login-page student-login">
  <header class="login-shell login-header">
    <a class="login-brand" href="index.html"><span aria-hidden="true">L</span> Librarian</a>
    <a href="index.html">الصفحة الرئيسية <span aria-hidden="true">↖</span></a>
    <button id="library-language" class="language-control" type="button" lang="en" aria-label="English" hidden>English</button>
  </header>
  <main class="login-shell login-layout">
    <div class="login-intro">
      <p class="login-eyebrow">المكتبة الرقمية / الطلاب</p>
      <h1>دخول الطالب</h1>
      <p>سجّل الدخول ببريدك الجامعي لتتابع كتبك واستعاراتك.</p>
      <a class="login-catalog" href="catalog.html">تصفّح كتالوج الكتب <span aria-hidden="true">←</span></a>
    </div>
    <section class="login-card" aria-labelledby="credentials">
      <div class="login-card-heading">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m2 8 10-5 10 5-10 5-10-5zm4 2v6c4 3 8 3 12 0v-6m4-2v7"/></svg>
        <h2 id="credentials">بيانات الحساب</h2>
      </div>
      <form id="login-form">
        <label for="studentEmail">البريد الجامعي</label>
        <input type="email" id="studentEmail" autocomplete="username" dir="ltr" required>
        <label for="studentPassword">كلمة المرور</label>
        <div class="login-password">
          <input type="password" id="studentPassword" autocomplete="current-password" dir="ltr" required>
          <button id="toggle-password" type="button" aria-controls="studentPassword" aria-pressed="false" hidden>إظهار</button>
        </div>
        <button id="reset-password" class="login-link-button" type="button" disabled>نسيت كلمة المرور؟</button>
        <button class="login-submit" type="submit" disabled>تسجيل الدخول</button>
        <p id="login-status" role="status" aria-atomic="true"></p>
        <noscript><p>فعّل JavaScript حتى تقدر تسجّل الدخول.</p></noscript>
      </form>
      <p class="login-register">ما عندك حساب؟ <a href="student-register.html">إنشاء حساب طالب</a></p>
    </section>
  </main>
<script type="module">
import { initLogin, showLoginStatus } from "./login-ui.js?v=language-1";

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getAuth,
  signOut,
  signInWithEmailAndPassword,
  sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";


// FIREBASE CONFIG

const firebaseConfig = {

  apiKey: "AIzaSyCkCR-nUCHQYRiLILTdSzCeYn2CTB94ILQ",

  authDomain: "laib-64c9b.firebaseapp.com",

  projectId: "laib-64c9b",

  storageBucket: "laib-64c9b.firebasestorage.app",

  messagingSenderId: "429556863392",

  appId: "1:429556863392:web:1cffe618fd87b6606914c5"
};


// INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


// LOGIN FUNCTION

async function authenticate(){

  const email =
  document.getElementById('studentEmail').value;

  const password =
  document.getElementById('studentPassword').value;


  if(!email || !password){

    showLoginStatus("يرجى تعبئة جميع الحقول.", "error");
    return;
  }

  try{

    // تسجيل الدخول

    const userCredential =
    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    const user =
    userCredential.user;


    // جلب بيانات الطالب من Firestore

    const studentRef =
    doc(db , "students" , user.uid);

    const studentSnap =
    await getDoc(studentRef);


    if (!studentSnap.exists()) {
      await signOut(auth);
      showLoginStatus("ما في ملف طالب مربوط بهالحساب.", "error");
      return;
    }

    // التحويل للبوابة

    window.location.href =
    "student-dashboard.html";

  }

  catch(error){

    showLoginStatus("تعذّر تسجيل الدخول. تأكّد من بريدك وكلمة المرور وحاول مرة ثانية.", "error");

  }

}
// RESET PASSWORD

async function resetPassword(){

  const email =
  document.getElementById("studentEmail").value;

  if(!email){

    showLoginStatus("أدخل بريدك الجامعي أولًا.", "error");
    return;
  }

  try{

    await sendPasswordResetEmail(
      auth,
      email
    );

    showLoginStatus("إذا البريد مربوط بحساب، رح يوصلك رابط إعادة تعيين كلمة المرور.", "success");

  }

  catch(error){

    showLoginStatus("تعذّر طلب إعادة تعيين كلمة المرور. تأكّد من البريد وحاول مرة ثانية.", "error");

  }

}

initLogin(authenticate, resetPassword);
</script>
</body>
</html>
