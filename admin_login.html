<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول أمين المكتبة | Librarian</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&amp;display=swap">
  <link rel="stylesheet" href="login.css">
</head>
<body class="login-page staff-login">
  <header class="login-shell login-header">
    <a class="login-brand" href="index.html"><span aria-hidden="true">L</span> Librarian</a>
    <a href="index.html">الصفحة الرئيسية <span aria-hidden="true">↖</span></a>
  </header>
  <main class="login-shell login-layout">
    <div class="login-intro">
      <p class="login-eyebrow">المكتبة الرقمية / الإدارة</p>
      <h1>دخول أمين المكتبة</h1>
      <p>سجّل الدخول بحساب أمين المكتبة للوصول إلى أدوات إدارة الكتب والأعضاء.</p>
      <a class="login-catalog" href="catalog.html">تصفّح كتالوج الكتب <span aria-hidden="true">←</span></a>
    </div>
    <section class="login-card" aria-labelledby="credentials">
      <div class="login-card-heading">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></svg>
        <h2 id="credentials">بيانات الحساب</h2>
      </div>
      <form id="login-form">
        <label for="adminEmail">البريد الإلكتروني</label>
        <input type="email" id="adminEmail" autocomplete="username" dir="ltr" required>
        <label for="adminPassword">كلمة المرور</label>
        <div class="login-password">
          <input type="password" id="adminPassword" autocomplete="current-password" dir="ltr" required>
          <button id="toggle-password" type="button" aria-controls="adminPassword" aria-pressed="false" hidden>إظهار</button>
        </div>
        
        <button class="login-submit" type="submit" disabled>تسجيل الدخول</button>
        <p id="login-status" role="status" aria-atomic="true"></p>
        <noscript><p>فعّل JavaScript حتى تقدر تسجّل الدخول.</p></noscript>
      </form>
      
    </section>
  </main>
<script type="module">
import { initLogin, showLoginStatus } from "./login-ui.js";

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";


// FIREBASE CONFIG

const firebaseConfig = {

  apiKey: "AIzaSyCkCR-nUCHQYRiLILTdSzCeYn2CTB94ILQ",

  authDomain: "laib-64c9b.firebaseapp.com",

  projectId: "laib-64c9b",

  storageBucket: "laib-64c9b.firebasestorage.app",

  messagingSenderId: "429556863392",

  appId: "1:429556863392:web:1cffe618fd87b6606914c5"
};


// INITIALIZE FIREBASE

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


// ADMIN LOGIN FUNCTION

async function authenticate(){

  const email =
  document.getElementById('adminEmail').value;

  const password =
  document.getElementById('adminPassword').value;


  if(!email || !password){

    showLoginStatus("يرجى تعبئة جميع الحقول.", "error");
    return;
  }

  try{

    // تسجيل الدخول

    const userCredential =
    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    const user =
    userCredential.user;


    // فحص إذا الحساب Admin

    const adminRef =
    doc(db , "librarians" , user.uid);

    const adminSnap =
    await getDoc(adminRef);


    if(adminSnap.exists()){

      

      window.location.href =
      "admin-dashboard.html";

    }else{

      showLoginStatus("هذا الحساب ما إله صلاحية أمين مكتبة.", "error");

    }

  }

  catch(error){

    showLoginStatus("تعذّر تسجيل الدخول. تأكّد من بريدك وكلمة المرور وحاول مرة ثانية.", "error");

  }

}


initLogin(authenticate);
</script>
</body>
</html>
